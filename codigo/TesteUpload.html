<!DOCTYPE html>
<html>
<head><base target="_top">
<style>
  body { font-family: Arial; font-size: 13px; padding: 12px; }
  input[type=file] { margin-bottom: 10px; }
  button { padding: 8px 16px; background: #2a6f4f; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #999; }
  pre { background: #f5f5f5; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
  .erro { color: #a33; }
</style>
</head>
<body>
  <h3>🧪 Teste Extrator PDF Direto</h3>
  <input type="file" id="pdf" accept="application/pdf">
  <br>
  <button id="btn" onclick="testar()" disabled>Testar extração</button>
  <div id="status"></div>
  <pre id="resultado"></pre>

<script>
  document.getElementById('pdf').onchange = function() {
    document.getElementById('btn').disabled = !this.files[0];
  };

  function testar() {
    const file = document.getElementById('pdf').files[0];
    if (!file) return;
    document.getElementById('btn').disabled = true;
    document.getElementById('status').innerHTML = '⏳ Analisando com IA...';
    document.getElementById('resultado').textContent = '';

    const r = new FileReader();
    r.onload = function() {
      const base64 = r.result.split(',')[1];
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('status').innerHTML = '✅ Concluído!';
          document.getElementById('resultado').textContent = JSON.stringify(res, null, 2);
          document.getElementById('btn').disabled = false;
        })
        .withFailureHandler(function(err) {
          document.getElementById('status').innerHTML = '<span class="erro">❌ ' + err.message + '</span>';
          document.getElementById('btn').disabled = false;
        })
        .testarExtracaoUpload(base64, file.name);
    };
    r.readAsDataURL(file);
  }
</script>
</body>
</html>
